name: Refresh Signal fundamental snapshots

on:
  workflow_dispatch:
    inputs:
      refresh_batch:
        description: "SEC Companyfacts records to refresh (100 is normal; 6500 is one-time catch-up)"
        type: choice
        required: true
        default: "100"
        options:
          - "100"
          - "1000"
          - "3000"
          - "6500"
  schedule:
    - cron: "43 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: sec-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync queued run with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test fundamental snapshot builder
        run: |
          python -m unittest discover -s tests -p "test_build_fundamental_snapshot.py" -v
          python -m unittest discover -s tests -p "test_build_fundamental_lookup_cache.py" -v
          python -m unittest discover -s tests -p "test_build_ticker_directory.py" -v
          python -m unittest discover -s tests -p "test_build_signal_feed.py" -v
          PYTHONPATH=scripts python -m unittest discover -s tests -p "test_nash_quantitative_score.py" -v
          PYTHONPATH=scripts python -m unittest discover -s tests -p "test_mypybite_scorecard_125.py" -v

      - name: Refresh SEC Companyfacts snapshots
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          REFRESH_BATCH: ${{ inputs.refresh_batch || '100' }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "Repository variable SEC_USER_AGENT is required."
            exit 1
          fi
          case "$REFRESH_BATCH" in
            100|1000|3000|6500) ;;
            *) echo "Invalid refresh batch: $REFRESH_BATCH"; exit 1 ;;
          esac
          echo "SEC cache refresh batch: $REFRESH_BATCH"
          python scripts/build_fundamental_snapshot.py
          python scripts/build_ticker_directory.py
          # The weekday schedule keeps refreshing 100 records per run.
          # A manual run may refresh up to 6500 companies once to catch up
          # after a new financial field is added. The SEC client enforces
          # a 0.25-second minimum interval between requests.
          python scripts/build_fundamental_lookup_cache.py --batch-size 6000 --refresh-batch-size "$REFRESH_BATCH" --initial-fill-minimum 5000
          python scripts/build_signal_feed.py --output signal-feed.json

      - name: Build MYPYBITE 125-point scorecard feed
        run: |
          python scripts/build_mypybite_scorecard_feed.py

      - name: Publish fundamental snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/sec/fundamentals/fundamentals.json \
            data/sec/fundamentals/ticker-lookup.json \
            data/sec/fundamentals/calculator-lookup.json \
            data/sec/fundamentals/scorecard-lookup.json \
            outputs/zero-cost-ticker-directory-development.json \
            signal-feed.json
          if git diff --cached --quiet; then
            echo "Fundamental snapshots are already current."
            exit 0
          fi
          git commit -m "Refresh Signal fundamental snapshots"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to publish fundamental snapshots after three attempts."
          exit 1
