name: Refresh SEC identity and FINRA short-interest assessments

on:
  workflow_dispatch:
  schedule:
    - cron: '7 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: refresh-signal-evidence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test calculations and ticker matching before publishing
        run: python -m unittest discover -s tests -p 'test_signal_evidence.py' -v
      - name: Fetch the SEC identity directory and calculate short-interest assessments
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/refresh_signal_evidence.py
      - name: Publish validated outputs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- outputs/zero-cost-ticker-directory-development.json data/finra/assessments.json data/sec/filings/new-issuer-recent.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh SEC directory and FINRA short-interest evidence"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
