name: Fetch latest Substack posts

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: fetch-substacks
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Publish seven newest Substack posts from Sheet cache
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MYPYBITE_SHEET_ID: ${{ secrets.MYPYBITE_SHEET_ID }}
        run: python scripts/fetch_substacks.py

      - name: Commit updated Substack feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add substack.json
          if git diff --cached --quiet; then
            echo "Substack feed is already current."
            exit 0
          fi
          git commit -m "Update Substack feed"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to publish Substack feed after three attempts."
          exit 1
