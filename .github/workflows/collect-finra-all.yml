name: Collect all FINRA short-interest records

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finra-all-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify required secrets are configured
        env:
          FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
          FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
          FINRA_ARCHIVE_PASSWORD: ${{ secrets.FINRA_ARCHIVE_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          required = ('FINRA_CLIENT_ID', 'FINRA_CLIENT_SECRET', 'FINRA_ARCHIVE_PASSWORD')
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Add repository secrets: ' + ', '.join(missing))
          if len(os.environ['FINRA_ARCHIVE_PASSWORD']) < 32:
              raise SystemExit('Use a unique randomly generated archive password of at least 32 characters.')
          PY

      - name: Run collector self-tests
        run: python scripts/fetch_finra_short_interest.py --self-test

      - name: Collect and validate all supported securities
        env:
          FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
          FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from datetime import date, datetime, timezone
          from pathlib import Path

          output = Path(os.environ['RUNNER_TEMP']) / 'finra-all.json'
          result = subprocess.run([
              sys.executable, 'scripts/fetch_finra_short_interest.py',
              '--directory', 'outputs/zero-cost-ticker-directory-development.json',
              '--output', str(output), '--max-pages', '100'
          ], capture_output=True, text=True)
          # Do not copy raw provider responses or individual observations to public logs.
          if result.returncode:
              raise SystemExit('FINRA collection failed. No archive published. Check credentials and provider availability; do not paste secret values into logs.')
          payload = json.loads(output.read_text(encoding='utf-8'))
          if payload.get('schema') != 'mypybite.finra-short-shares.RESEARCH-ONLY.v1' or payload.get('publishable') is not False:
              raise SystemExit('Unexpected research contract.')
          settlement = date.fromisoformat(payload['settlementDate'])
          if not 0 <= (datetime.now(timezone.utc).date() - settlement).days <= 45:
              raise SystemExit('Settlement date is invalid or stale.')
          records = payload.get('records')
          if not isinstance(records, list) or not records:
              raise SystemExit('No verified securities collected.')
          seen = set()
          for row in records:
              ticker = row.get('ticker')
              if not ticker or ticker in seen or row.get('asOf') != settlement.isoformat():
                  raise SystemExit('Duplicate security or reporting-date mismatch.')
              if type(row.get('shortShares')) is not int or row['shortShares'] < 0:
                  raise SystemExit('Invalid short-share count.')
              seen.add(ticker)
          # Only operational coverage counts enter the public run summary.
          summary = [
              '## FINRA full-reporting-period collection',
              f'Settlement date: {settlement}',
              f'Verified securities collected: {len(records)}',
              'Coverage: ' + json.dumps(payload.get('coverage', {}), sort_keys=True),
              'All-symbol query: no ticker filter was supplied.',
              'Source observations will be retained only in an encrypted artifact.',
              'No public feed, Zoho display, percentage, or points changed.'
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as file:
              file.write('\n\n'.join(summary) + '\n')
          PY

      - name: Encrypt collected records
        env:
          FINRA_ARCHIVE_PASSWORD: ${{ secrets.FINRA_ARCHIVE_PASSWORD }}
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -in "$RUNNER_TEMP/finra-all.json" \
            -out "$RUNNER_TEMP/finra-all.json.enc" \
            -pass env:FINRA_ARCHIVE_PASSWORD

      - name: Retain encrypted research download for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: finra-all-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/finra-all.json.enc
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary unencrypted output
        if: always()
        run: rm -f -- "$RUNNER_TEMP/finra-all.json"
