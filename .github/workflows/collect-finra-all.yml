name: Collect all FINRA short-interest records

on:
  workflow_dispatch:
  schedule:
    - cron: '37 11 * * 1-5'

permissions:
  contents: write

concurrency:
  group: finra-all-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collector
        run: python scripts/fetch_finra_short_interest.py --self-test
      - name: Collect and build public FINRA display feed
        env:
          FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
          FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          """Normalize all verified securities; no publication permission is inferred."""
          import argparse
          from datetime import date
          import json
          from pathlib import Path
          import re
          
          
          def build(payload):
              if payload.get('schema') != 'mypybite.finra-short-shares.RESEARCH-ONLY.v1':
                  raise ValueError('Unexpected collector schema')
              settlement = payload.get('settlementDate')
              if not isinstance(settlement, str) or date.fromisoformat(settlement).isoformat() != settlement or not 0 <= (date.today() - date.fromisoformat(settlement)).days <= 45:
                  raise ValueError('Invalid settlement date')
              rows = []
              seen = set()
              records = payload.get('records')
              if not isinstance(records, list) or not records:
                  raise ValueError('Refusing an empty display feed')
              for item in records:
                  ticker, cik, shares = item.get('ticker'), item.get('cik'), item.get('shortShares')
                  if not isinstance(ticker,str) or not re.fullmatch(r'[A-Z0-9][A-Z0-9.\-]{0,19}',ticker) or ticker in seen:
                      raise ValueError('Invalid or duplicate security')
                  if not isinstance(cik,str) or not re.fullmatch(r'\d{10}',cik) or int(cik)==0:
                      raise ValueError('Invalid CIK')
                  if type(shares) is not int or not 0 <= shares <= 9007199254740991 or item.get('asOf') != settlement:
                      raise ValueError('Invalid count or mismatched period')
                  seen.add(ticker)
                  rows.append({'ticker':ticker,'cik':cik,'shortShares':shares,'settlementDate':settlement})
              return {'schema':'mypybite.finra-display.v2','delivery':'public-noncommercial',
                      'source':'FINRA','owner':'FINRA','usage':'Non-commercial personal or professional use only. No further redistribution.','termsUrl':'https://developer.finra.org/specific-terms-equity-data','settlementDate':settlement,'retrievedAt':payload.get('retrievedAt'),
                      'coverage':payload.get('coverage'),'data':sorted(rows,key=lambda row:row['ticker'])}
          
          
          
          import os
          import subprocess
          import sys
          raw = Path(os.environ['RUNNER_TEMP']) / 'finra-research.json'
          result = subprocess.run([sys.executable, 'scripts/fetch_finra_short_interest.py',
              '--directory', 'outputs/zero-cost-ticker-directory-development.json',
              '--output', str(raw), '--max-pages', '100'], capture_output=True, text=True)
          if result.returncode:
              raise SystemExit('FINRA collection failed. Existing public feed preserved. Check authentication and provider availability.')
          try:
              result = build(json.loads(raw.read_text(encoding='utf-8')))
          finally:
              raw.unlink(missing_ok=True)
          destination = Path('data/finra/display.json')
          if destination.exists():
              previous = json.loads(destination.read_text(encoding='utf-8'))
              if previous.get('settlementDate', '') > result['settlementDate']:
                  raise SystemExit('Refusing to replace a newer reporting period.')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(result, separators=(',', ':'))+'\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## FINRA public display feed\n\nOwner and source: FINRA\n\nSettlement date: '+result['settlementDate']+'\n\nVerified securities: '+str(len(result['data']))+'\n\nCoverage: '+json.dumps(result['coverage'])+'\n\nShares short only; no percentage or scoring changes.\n')
          PY
      - name: Publish only the display feed to NewsRiver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/finra/display.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh FINRA short-interest display feed"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
