name: Enrich SEC filing metadata

on:
  workflow_dispatch:

  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: write

concurrency:
  group: enrich-sec-metadata
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test SEC collectors
        run: python -m unittest discover -s tests -p "test_*sec*.py" -v

      - name: Enrich filing metadata
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "Repository variable SEC_USER_AGENT is required."
            exit 1
          fi
          python scripts/enrich_sec_metadata.py --max-filings 250

      - name: Commit updated SEC metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sec/metadata/filings.jsonl data/sec/metadata/state.json data/sec/metadata/audit.json
          if git diff --cached --quiet; then
            echo "SEC filing metadata is already current."
            exit 0
          fi
          git commit -m "Update SEC filing metadata"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to publish SEC metadata after three attempts."
          exit 1
