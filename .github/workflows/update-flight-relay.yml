name: Update public flight relay

on:
  workflow_dispatch:
  schedule:
    - cron: "9,39 * * * *"

permissions:
  contents: write

concurrency:
  group: update-public-flight-relay
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install "requests>=2.31.0"
      - name: Build public flight summary
        run: python scripts/update_flight_relay.py
      - name: Commit flight relay
        run: |
          if [ -z "$(git status --porcelain -- flight.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight.json
          git commit -m "Update public flight relay [ci skip]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
