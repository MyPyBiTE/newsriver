name: Test SEC Share Stability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sec-share-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: |
          python3 -m py_compile scripts/validate_sec_share_stability.py

      - name: Run SEC share stability self-tests
        run: |
          python3 scripts/validate_sec_share_stability.py --self-test

      - name: Confirm research-only test
        run: |
          echo "SEC share stability offline tests completed."
          echo "No live SEC requests were made."
          echo "No MYPYBITE scores or public feeds were modified."
