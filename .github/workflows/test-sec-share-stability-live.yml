name: Test SEC Share Stability Live

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sec-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: |
          python3 -m py_compile scripts/validate_sec_share_stability.py

      - name: Validate Microsoft shares against live SEC data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python3 scripts/validate_sec_share_stability.py \
            --cik 0000789019 \
            --from-date 2026-08-24 \
            --to-date 2026-10-30 \
            --max-age-days 120 \
            --threshold-pct 1.0

      - name: Confirm research-only execution
        run: |
          echo "SEC share-count research test completed."
          echo "No MYPYBITE scores or public feeds modified."
