name: Update MYPYBITE BTC zone bulletin

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: btc-zone-bulletin
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Calculate confirmed 4-hour zones
        run: python scripts/update_btc_zone_bulletin.py
      - name: Commit changed bulletin
        run: |
          git config user.name "mypybite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add btc_zone_bulletin.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update BTC zone bulletin"
          git push

